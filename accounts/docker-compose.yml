services:
  accounts:
    image: "ntuan2908/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - ntuan2908
  loans:
    image: "ntuan2908/loans:s4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - ntuan2908
  cards:
    image: "ntuan2908/cards:s4"
    container_name: cards-ms
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - ntuan2908
networks:
  ntuan2908:
    driver: "bridge"