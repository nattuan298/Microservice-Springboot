    active: git
  cloud:
    config:
      server:
#        native:
#          search-locations: "file:///Users//tuannguyen//Documents//config"
#          search-locations: "classpath:/config"
        git:
          uri: "https://github.com/nattuan298/microservices-config"
          default-label: main
          timeout: 5
          clone-on-start: true
